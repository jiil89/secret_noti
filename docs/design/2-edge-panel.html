<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>엣지패널 열린 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#173DA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #16181D">

<div style="display: flex; flex-direction: column; gap: 0px">
<div style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 18px; font-weight: 700">영상</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
</div>
<div style="height: 220px; background: #23262D; display: flex; align-items: center; justify-content: center">
<svg width="48" height="48" viewBox="0 0 24 24" fill="#FFFFFF" stroke="none" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 17px; font-weight: 700">10분 완성 원팬 파스타 레시피</span>
<span style="font-size: 13px; color: #5B6270">조회수 1.2만회 · 3일 전</span>
</div>
<div style="padding: 8px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px"><div style="width: 160px; height: 90px; border-radius: 8px; background: #D9DCE1; flex-shrink: 0"></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 500">자취생 일주일 장보기 루틴</span><span style="font-size: 12px; color: #5B6270">조회수 8천회</span></div></div>
<div style="display: flex; gap: 12px"><div style="width: 160px; height: 90px; border-radius: 8px; background: #D9DCE1; flex-shrink: 0"></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 500">에어프라이어 반찬 5가지</span><span style="font-size: 12px; color: #5B6270">조회수 3.4만회</span></div></div>
<div style="display: flex; gap: 12px"><div style="width: 160px; height: 90px; border-radius: 8px; background: #D9DCE1; flex-shrink: 0"></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 500">주말 브런치 카페 투어</span><span style="font-size: 12px; color: #5B6270">조회수 2.1만회</span></div></div>
</div>
</div>

<a href="Handle.dc.html" aria-label="엣지패널 닫기" style="position: absolute; inset: 0; background: rgba(10, 12, 16, 0.5); display: block"></a>

<div style="position: absolute; right: 0; top: 96px; width: 316px; height: 652px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px 0 0 28px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28); padding: 20px 16px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="position: absolute; left: 8px; top: 50%; width: 4px; height: 48px; margin-top: -24px; border-radius: 2px; background: #D5D8DE"></div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 20px; font-weight: 700">최근 메시지</span>
<span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #E8EEFF; color: #1F4FD1; font-size: 12px; font-weight: 500">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F4FD1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
읽음 표시 안 남음
</span>
</div>

<div style="display: flex; gap: 8px">
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #16181D; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500">전체</button>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D8DE; background: #FFFFFF; color: #3B3F47; font-family: inherit; font-size: 13px; font-weight: 500">카톡</button>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D8DE; background: #FFFFFF; color: #3B3F47; font-family: inherit; font-size: 13px; font-weight: 500">문자</button>
</div>

<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="Room.dc.html" style="display: flex; gap: 12px; padding: 10px 4px; border-radius: 14px; text-decoration: none; color: #16181D">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #EEF0F3; color: #3B3F47; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0">{{item.initial}}</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</span>
<span style="font-size: 11px; color: #5B6270; white-space: nowrap; margin-left: auto">{{item.time}}</span>
</div>
<div style="display: flex; align-items: flex-start; gap: 8px">
<span style="font-size: 13px; line-height: 1.45; color: #3B3F47; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1">{{item.preview}}</span>
<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #2558E8; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{item.count}}</span>
</div>
<span style="font-size: 11px; color: #5B6270">{{item.source}}</span>
</div>
</a>
</sc-for>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #EEF0F3; padding-top: 10px">
<a href="Room.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none; padding: 10px 4px">모든 기록 보기</a>
<button type="button" aria-label="설정" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #F4F5F7; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B3F47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
items: [
{ initial: '엄', name: '엄마', time: '오후 8:52', preview: '주말에 김치 가지러 올 거지? 미리 말해줘', count: 1, source: '카카오톡' },
{ initial: '동', name: '회사 동기 단톡방 8', time: '오후 8:47', preview: '민수: 다음 주 금요일 회식 장소 투표 올렸어요', count: 12, source: '카카오톡' },
{ initial: '김', name: '김팀장님', time: '오후 8:30', preview: '월요일 보고 자료 오전 중에 한번 볼 수 있을까요?', count: 1, source: '카카오톡' },
{ initial: '택', name: '택배 알림', time: '오후 7:15', preview: '[배송완료] 주문하신 상품이 문 앞에 도착했습니다.', count: 1, source: '문자' },
{ initial: '대', name: '대학 친구들', time: '오후 6:02', preview: '지훈: 사진 3장을 보냈습니다', count: 5, source: '카카오톡' }
]
};
}
}
</script>
</body>
</html>
